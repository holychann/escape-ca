# 팀 저장소(leekwangeun/escape-car) main에 커밋이 들어오면(PR merge, 직접 push 모두, 바뀐 폴더와 상관없이)
# 서버 테스트를 돌리고, 통과하면 Lightsail 서버에 SSH로 들어가 server/deploy/lightsail_deploy.sh를 돌립니다.
# 서버는 저장소 전체를 받습니다(앱 그림 car/app/src/main/assets/img 등 server/ 밖 파일도).
# server/가 그대로면 이미지도 그대로라 컨테이너를 다시 띄우지 않습니다.
# 처음 한 번 할 설정(배포 키, Secrets, Variables)은 server/배포_방법.md 7번.
name: 이야기 서버 배포

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로 다시 배포할 때
  workflow_dispatch:

# 배포는 한 번에 하나씩. 도는 중인 배포는 끊지 않고, 그동안 들어온 것 중 마지막 것만 이어서 돕니다
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # fork(작업 저장소)에 push했을 때는 돌지 않습니다
    if: github.repository == 'leekwangeun/escape-car'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      # API 키 없이 돕니다(tests/conftest.py가 키를 지워 유료 호출을 막음)
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.repository == 'leekwangeun/escape-car'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Settings → Environments → lightsail 에서 배포 전 승인, main만 허용 같은 규칙을 걸 수 있습니다
    environment: lightsail
    steps:
      - name: 배포 키 준비
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo "::error::LIGHTSAIL_HOST, LIGHTSAIL_SSH_KEY, LIGHTSAIL_KNOWN_HOSTS Secrets가 필요합니다 (server/배포_방법.md 7번)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Lightsail에 배포
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
        # 서버의 authorized_keys가 이 키로는 lightsail_deploy.sh만 돌리게 묶어 두어, 여기서 보내는 건 커밋 SHA뿐입니다
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o BatchMode=yes \
              "$SSH_USER@$HOST" "$GITHUB_SHA"

      - name: 바깥에서 /health 확인
        if: vars.STORY_DOMAIN != ''
        env:
          DOMAIN: ${{ vars.STORY_DOMAIN }}
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 "https://$DOMAIN/health"
          echo

      - name: 배포 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
