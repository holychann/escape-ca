# 이야기 서버 테스트. main에 들어온 커밋과 main으로 가는 PR마다 돕니다.
# Lightsail 서버는 이 결과를 보고 스스로 배포합니다(server/deploy/lightsail_poll.sh).
# 서버는 job 이름 server-tests로 결과를 찾으니, 이름을 바꾸면 lightsail_poll.sh도 같이 바꿔야 합니다.
# GitHub에 넣는 비밀 값은 없습니다. 자세한 내용은 server/배포_방법.md 7번.
name: 서버 테스트

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 앞의 테스트는 끊습니다(서버는 main 맨 끝 커밋의 결과만 봅니다)
concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-tests:
    name: server-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      # API 키 없이 돕니다(tests/conftest.py가 키를 지워 유료 호출을 막음)
      - run: python -m pytest -q
