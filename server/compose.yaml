# Lightsail 인스턴스에서: cd server && docker compose up -d --build
# .env(같은 폴더)에 API 키와 STORY_DOMAIN을 넣어 둡니다. 절차는 배포_방법.md
services:
  story:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      STORY_DATA_DIR: /data
    volumes:
      - story-data:/data
    # 바깥으로 포트를 열지 않습니다. 앞의 Caddy만 이 서버에 닿습니다
    expose:
      - "8787"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - story
    ports:
      - "80:80"
      - "443:443"
    environment:
      STORY_DOMAIN: ${STORY_DOMAIN:?set STORY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  story-data:   # 이야기 기록, 부모 신고, 그림
  caddy-data:   # HTTPS 인증서. 지우면 다시 받아야 해서 발급 횟수 제한에 걸릴 수 있습니다
  caddy-config:
